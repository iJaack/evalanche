name: SDK checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.2', '22']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          EVALANCHE_DESTRUCTIVE_TESTS: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: Validate docs, exports, package and smoke
        run: |
          mkdir -p .release-artifacts
          VERSION=$(node -p "require('./package.json').version")
          node scripts/export-mcp-tools.mjs --out .release-artifacts/mcp-tools.json
          node scripts/check-docs-parity.mjs --version "$VERSION" --mcp-tools .release-artifacts/mcp-tools.json
          npm pack --json --pack-destination .release-artifacts > .release-artifacts/npm-pack.json
          node scripts/check-package-tarball.mjs --pack-json .release-artifacts/npm-pack.json
          node scripts/check-consumer-install.mjs --pack-json .release-artifacts/npm-pack.json --out .release-artifacts/consumer-install.json
          node scripts/release-smoke.mjs
          node scripts/check-signer-bin.mjs --pack-json .release-artifacts/npm-pack.json
      - name: Audit regression gate
        run: |
          npm audit --omit=dev --json > .release-artifacts/audit.json || true
          node scripts/check-audit-regressions.mjs --audit .release-artifacts/audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sdk-check-evidence-node-${{ matrix.node }}
          path: .release-artifacts/
          include-hidden-files: true

  # No compiler and no Python. The signer lock must come from the pinned helper.
  signer-linux-clean:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['node:20.19.2-bookworm-slim', 'node:22-bookworm-slim']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - name: Install git without build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: npm ci
      - run: npx vitest run test/signer test/poc test/poc2 test/poc3
        env:
          EVALANCHE_DESTRUCTIVE_TESTS: '1'

  signer-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run test/signer test/poc test/poc2 test/poc3
        env:
          EVALANCHE_DESTRUCTIVE_TESTS: '1'

  # Rebuild the committed helper with the pinned GCC 13.3 toolchain and compare sha256.
  flock-reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Rebuild flock-linux-x64 and compare the pinned digest
        run: |
          docker build --platform linux/amd64 -t evalanche-flock-repro -f docker/flock-helper.Dockerfile .
          mkdir -p .flock-repro
          cid=$(docker create evalanche-flock-repro)
          docker cp "$cid":/flock-linux-x64 .flock-repro/flock-linux-x64
          docker rm "$cid" >/dev/null
          digest=$(sed -n "s/.*LINUX_HELPER_SHA256 = '\\([0-9a-f]\\{64\\}\\)'.*/\\1/p" src/signer/flock.ts)
          test -n "$digest"
          echo "$digest  .flock-repro/flock-linux-x64" | sha256sum -c -
          cmp .flock-repro/flock-linux-x64 src/signer/helpers/flock-linux-x64

  # Root-owned config and a dedicated signer user. The container entrypoint is root.
  signer-root-layout:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['node:20.19.2-bookworm-slim', 'node:22-bookworm-slim']
    container:
      image: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - name: Install git and useradd without build tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates passwd
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: npm ci
      - run: npm run build
      - run: node scripts/signer-root-layout.mjs

  # The mount-namespace restore test. A skipped run fails this job.
  signer-root-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore under a real root mount namespace
        run: npx vitest run test/poc3/grok-bot-signer.test.ts -t "creates a missing evalanche-signer"
        env:
          EVALANCHE_DESTRUCTIVE_TESTS: '1'
          EVALANCHE_REQUIRE_ROOT_RESTORE: '1'

  # Two fresh npm ci trees must pack to the same sha256. A symlinked
  # node_modules is not used: esbuild would embed that realpath.
  reproducible-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20.19.2'
          cache: npm
      - name: Pack from two directories and compare
        run: |
          set -eu
          root="$GITHUB_WORKSPACE"
          left=$(mktemp -d)
          right=$(mktemp -d)
          copy() {
            tar -C "$root" --exclude node_modules --exclude dist --exclude .git -cf - . | tar -C "$1" -xf -
          }
          copy "$left"
          copy "$right"
          (cd "$left" && npm ci && npm run build && npm pack --json > pack.json)
          (cd "$right" && npm ci && npm run build && npm pack --json > pack.json)
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            import { spawnSync } from "node:child_process";
            const hash = (file) => createHash("sha256").update(readFileSync(file)).digest("hex");
            const packed = (dir) => `${dir}/${JSON.parse(readFileSync(`${dir}/pack.json`, "utf8"))[0].filename}`;
            const leftFile = packed(process.argv[1]);
            const rightFile = packed(process.argv[2]);
            const leftHash = hash(leftFile);
            const rightHash = hash(rightFile);
            console.log(`left ${leftHash}`);
            console.log(`right ${rightHash}`);
            if (leftHash !== rightHash) process.exit(1);
            const listed = spawnSync("tar", ["-tzf", leftFile], { encoding: "utf8" });
            if (listed.status !== 0) process.exit(listed.status ?? 1);
            for (const entry of listed.stdout.split("\n").filter(Boolean)) {
              if (entry.endsWith("/")) continue;
              const bytes = spawnSync("tar", ["-xOzf", leftFile, entry]).stdout;
              console.log(`${createHash("sha256").update(bytes).digest("hex")}  ${entry}`);
            }
          ' "$left" "$right"
